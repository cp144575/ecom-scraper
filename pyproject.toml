[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecom-scraper"
version = "0.1.0"
description = "Self-built crawler engine for multi-platform e-commerce data collection."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "lxml",
    "selectolax",
    "pydantic",
    "sqlalchemy>=2",
    "alembic",
    "orjson",
    "httpx",
    "pymysql",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ecom_scraper"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".agents", "docs", "roadmap", ".idea", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
plugins = ["sqlalchemy.ext.mypy.plugin"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["selectolax"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
